name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Publishes blog posts whose date has arrived (Europe/Istanbul day).
    # GitHub can delay scheduled runs by hours, worst at the top of the hour,
    # so run every 3 hours at an odd minute. Builds are idempotent.
    # 00:17 UTC = 03:17 TR, 03:17 UTC = 06:17 TR, ...
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # keep-alive step below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit and content tests
        run: npm test

      - name: Build with filled test config and check it
        run: npm run test:build:filled

      - name: Build the real site
        run: npm run generate

      - name: Check generated site
        run: npm run test:build

      - name: Check internal links
        run: npm run check:links

      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Re-enabling via the API on every scheduled run keeps future-dated posts publishing
      # even when you write posts far ahead and push nothing for months.
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
