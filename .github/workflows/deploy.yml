name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC = 06:00 Europe/Istanbul. Publishes blog posts whose date has arrived.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit and content tests
        run: npm test

      - name: Build with filled test config and check it
        run: npm run test:build:filled

      - name: Build the real site
        run: npm run generate

      - name: Check generated site
        run: npm run test:build

      - name: Check internal links
        run: npm run check:links

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
